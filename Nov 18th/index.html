<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container directory d-flex align-items-center gap-2">
      <span class="brand-icon"><i class="bi bi-person-rolodex" aria-hidden="true"></i></span>
      <span class="brand-name">Address Book</span>
    </div>
  </header>

  <main class="container directory">
    <section class="page-heading" aria-labelledby="page-title">
      <h1 id="page-title">Contacts</h1>
      <p>Find someone by name, phone, or email.</p>
    </section>

    <div class="filter-panel">
      <div class="search-field">
        <label class="form-label" for="search">Search contacts</label>
        <div class="input-with-icon">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input class="form-control" type="search" id="search" placeholder="Name, phone, or email">
        </div>
      </div>
      <div class="gender-field">
        <label class="form-label" for="gender">Gender</label>
        <select class="form-select" id="gender">
          <option value="">All genders</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
    </div>

    <p id="result-count" class="result-count" role="status"></p>
    <div id="contact-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
    <div id="empty-state" class="empty-state" hidden>
      <i class="bi bi-search" aria-hidden="true"></i>
      <h2>No contacts found</h2>
      <p>Try a different search or gender filter.</p>
      <button type="button" id="clear-filters" class="btn btn-outline-secondary btn-sm">Clear filters</button>
    </div>
  </main>

  <template id="contact-template">
    <div class="col">
      <article class="card contact-card h-100">
        <div class="card-body">
          <div class="contact-header">
            <img class="contact-photo rounded-3 object-fit-cover flex-shrink-0" alt="" width="64" height="64">
            <div>
              <h2 class="contact-name"></h2>
              <p class="contact-gender"></p>
            </div>
          </div>
          <div class="contact-details">
            <div><i class="bi bi-telephone" aria-hidden="true"></i><a class="contact-phone"></a></div>
            <div><i class="bi bi-envelope" aria-hidden="true"></i><a class="contact-email"></a></div>
          </div>
          <ul class="contact-tags list-unstyled" aria-label="Tags"></ul>
        </div>
        <div class="card-footer contact-footer">
          <div class="note-header">
            <span class="note-label"><i class="bi" aria-hidden="true"></i> <span></span></span>
            <button type="button" class="btn btn-sm note-toggle" hidden></button>
          </div>
          <p class="contact-note"></p>
        </div>
      </article>
    </div>
  </template>
</body>
</html>
