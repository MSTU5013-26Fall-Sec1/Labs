<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container py-5">
    <section class="todo-app mx-auto" aria-labelledby="app-title">
      <p class="eyebrow mb-2">ONE TASK AT A TIME</p>
      <h1 id="app-title" class="fw-bold mb-2">My to-do list</h1>
      <p class="text-secondary mb-4">A little space for what comes next.</p>

      <button id="create-button" class="btn btn-primary" type="button" aria-controls="task-form" aria-expanded="false">+ Create</button>

      <!-- A form submits when the user presses Enter or clicks Save. -->
      <form id="task-form" class="mt-4" hidden>
        <label for="task-input" class="form-label fw-semibold">What do you need to do?</label>
        <div class="input-group">
          <input id="task-input" class="form-control" type="text" placeholder="e.g. Practice JavaScript functions" required autocomplete="off">
          <button class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>

      <div class="mt-4 pt-3 border-top">
        <h2 class="h6 fw-semibold mb-3">Tasks</h2>
        <p id="empty-message" class="text-secondary mb-0">Your list is clear. Create a task to get started.</p>
        <ul id="task-list" class="list-group list-group-flush" aria-label="Saved tasks" aria-live="polite" aria-relevant="additions"></ul>
      </div>
      <p class="small text-secondary mt-4 mb-0">Tasks stay here until you refresh the page.</p>
    </section>
  </main>
</body>
</html>
