<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple three-light switch project for learning HTML, CSS, and JavaScript.">
    <title>Light Switch Room</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131722'/%3E%3Ccircle cx='32' cy='27' r='16' fill='%23ffd35a'/%3E%3Crect x='25' y='42' width='14' height='9' rx='3' fill='%23e6edf7'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="room">
        <h1>Light Switch Room</h1>
        <p id="room-status" class="room-status" aria-live="polite">
            The room is dark. All lights are off.
        </p>

        <section class="lights" aria-label="Room lights">
            <article class="light-card">
                <div class="bulb" aria-hidden="true">💡</div>
                <h2>Light 1</h2>
                <button class="switch-button" type="button" aria-pressed="false">
                    Turn on
                </button>
            </article>

            <article class="light-card">
                <div class="bulb" aria-hidden="true">💡</div>
                <h2>Light 2</h2>
                <button class="switch-button" type="button" aria-pressed="false">
                    Turn on
                </button>
            </article>

            <article class="light-card">
                <div class="bulb" aria-hidden="true">💡</div>
                <h2>Light 3</h2>
                <button class="switch-button" type="button" aria-pressed="false">
                    Turn on
                </button>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
