<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Machine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5 text-center">
    <h1>Coffee Machine</h1>
    <p>Turn on the machine, choose a cup size, and press Start.</p>

    <div class="machine mx-auto p-4 rounded">
      <p id="powerStatus" role="status">Power: Off</p>
      <div class="spout mx-auto"></div>
      <div id="cup" class="cup mx-auto" aria-hidden="true">
        <div id="coffee"></div>
      </div>
    </div>

    <div class="d-flex flex-wrap justify-content-center gap-2 my-4">
      <button id="sizeButton" class="btn btn-secondary" onclick="changeSize()" disabled>Size: Small</button>
      <button id="brewButton" class="btn btn-success" onclick="startStop()" disabled>Start</button>
      <button id="powerButton" class="btn btn-dark" onclick="togglePower()" aria-pressed="false">Turn on</button>
    </div>

    <p id="brewStatus" role="status">Coffee: Empty</p>
    <p class="text-muted">Start fills the cup immediately. Stop clears it. Turning off also clears it.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
